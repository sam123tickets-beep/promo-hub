  --bg:#0b0f19;--surface:#121827;--surface-2:#19203102;--surface-2:#192031;--line:#212a3d;--line-2:#2d3850;
  --text:#e8ecf5;--text-2:#a6afc2;--text-3:#6f7a90;
  --pos:#34d399;--neg:#f87171;--warn:#fbbf24;--accent:#9b87ff;--accent-soft:rgba(155,135,255,.15);
  --hdr:#111a33;--hdr-2:#1b2648;--shadow:none;color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 var(--font);-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01";font-variant-numeric:tabular-nums}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
[hidden]{display:none!important}
.pos{color:var(--pos)!important}.neg{color:var(--neg)!important}.warn{color:var(--warn)!important}
.dim{color:var(--text-3)}.dim2{color:var(--text-2)}.soft{color:var(--text-2)}.strong{font-weight:600;color:var(--text)}
em{font-style:normal;font-weight:600}
svg{flex:none}

/* ---- header + tabs ---- */
.hdr{background:var(--hdr);color:#fff;position:relative;z-index:30}
.hdr-in{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 24px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;letter-spacing:-.01em;color:#fff}
.brand .logo{display:inline-flex}.brand .logo svg{width:30px;height:30px;border-radius:8px;display:block}
.hdr-r{margin-left:auto;display:flex;align-items:center;gap:8px}
.psel{height:36px;border-radius:9px;border:0;background:#fff;color:#141a2b;font-weight:600;font-size:13.5px;padding:0 30px 0 12px;max-width:190px}
.psel:disabled{opacity:.55}
.hbtn{width:36px;height:36px;border-radius:9px;background:var(--hdr-2);color:#fff;display:grid;place-items:center;font-size:18px;line-height:1}
.hbtn:hover{filter:brightness(1.2)}
.hbtn svg,.csvbtn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hbtn.spin svg{animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.csvbtn{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 13px;border-radius:9px;background:#22c55e;color:#06260f;font-weight:700;font-size:13.5px;cursor:pointer;white-space:nowrap}
.csvbtn:hover{background:#2fd56b}.csvbtn input{display:none}
.menu{position:relative}
.menu-pop{position:absolute;right:0;top:44px;min-width:210px;background:var(--surface);color:var(--text);border:1px solid var(--line-2);border-radius:12px;box-shadow:0 16px 40px rgba(0,0,0,.25);padding:6px;display:flex;flex-direction:column}
.menu-pop>a,.menu-pop>button{display:flex;align-items:center;gap:8px;text-align:left;padding:9px 10px;border-radius:8px;font-size:14px;font-weight:500;color:var(--text)}
.menu-pop>a:hover,.menu-pop>button:hover{background:var(--surface-2)}
.menu-pop svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
.mstat{font-size:12px;color:var(--text-3);padding:6px 10px;border-top:1px solid var(--line);margin-top:4px}
.strip{height:3px;background:linear-gradient(90deg,#6d4aff,#8b5cf6 30%,#22c55e 70%,#facc15)}
.tabbar{position:sticky;top:0;z-index:25;background:var(--surface);border-bottom:1px solid var(--line)}
.tabbar-in{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:0 24px}
.tabs2{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.tabs2::-webkit-scrollbar{display:none}
.tabs2 button{padding:14px 12px 12px;font-size:14px;font-weight:600;color:var(--text-2);border-bottom:2px solid transparent;white-space:nowrap}
.tabs2 button:hover{color:var(--text)}
.tabs2 button.on{color:var(--accent);border-bottom-color:var(--accent)}
.tb-r{display:flex;align-items:center;gap:14px;flex:none}
.gwrap{position:relative;width:250px;display:flex;align-items:center}
.gwrap .ico{position:absolute;left:10px;color:var(--text-3);display:flex}
.gwrap .ico svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.gsearch{width:100%;height:34px;padding:0 10px 0 32px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);outline:none;font-size:13.5px}
.gsearch:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.gresults{position:absolute;top:40px;right:0;width:340px;background:var(--surface);border:1px solid var(--line-2);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.18);padding:6px;z-index:40}
.gres{display:grid;grid-template-columns:62px minmax(0,1fr);gap:0 10px;padding:8px 10px;border-radius:8px}
.gres .kind{grid-row:1/span 2;font-size:11px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.04em;padding-top:2px}
.gres b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.gres .muted{font-size:12.5px;color:var(--text-3)}
.gres.on,.gres:hover{background:var(--surface-2)}.gres.none{display:block;color:var(--text-3)}
.upd{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text-3);white-space:nowrap}
.upd i{width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.18)}
main{max-width:1240px;margin:0 auto;padding:22px 24px 80px}
.ptitle{margin:0;font-size:24px;font-weight:700;letter-spacing:-.02em}
h1.ptitle{margin:0 0 16px}
.ptitle-row{display:flex;align-items:center;gap:10px;margin-bottom:16px}.ptitle-row h1.ptitle{margin:0}
.stp{width:34px;height:34px;border-radius:50%;border:1px solid var(--line-2);background:var(--surface);font-size:20px;line-height:1;color:var(--text);display:grid;place-items:center;padding-bottom:3px}
.stp:hover:not([disabled]){background:var(--surface-2)}.stp[disabled]{opacity:.3;cursor:default}
.lead2{margin:-8px 0 16px;color:var(--text-2)}
/* KPI cards */
.kcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;box-shadow:var(--shadow);display:flex;flex-direction:column;min-width:0}
.kc.lead{background:linear-gradient(135deg,color-mix(in srgb,var(--pos) 10%,var(--surface)),var(--surface));border-color:color-mix(in srgb,var(--pos) 30%,var(--line))}
.kc span{font-size:12.5px;color:var(--text-3);font-weight:500}
.kc b{font-size:23px;font-weight:700;letter-spacing:-.02em;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kc small{font-size:12px;color:var(--text-3);margin-top:2px}
.dl{font-style:normal;font-size:12px;font-weight:600;margin-top:2px}.dl.up{color:var(--pos)}.dl.down{color:var(--neg)}.dl i{font-style:normal;font-weight:400;color:var(--text-3)}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 16px}
.see{font-size:13px;font-weight:600;color:var(--accent)}
.cctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.cctl .search{flex:0 1 230px}
.cnt2{font-size:12.5px;font-weight:500;color:var(--text-3);margin-left:4px}
.cnav{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:9px;background:var(--surface);height:32px}
.cnav button{width:30px;height:30px;font-size:17px;color:var(--text-2)}.cnav button[disabled]{opacity:.3;cursor:default}
.cnav b{font-size:13px;min-width:46px;text-align:center;padding:0 4px;white-space:nowrap}
.cfoot{display:flex;justify-content:space-between;gap:10px;margin-top:6px}
/* rank list */
.rl{list-style:none;margin:0 -6px;padding:0}
.rl li a{display:flex;align-items:center;gap:12px;padding:9px 6px;border-top:1px solid var(--line);border-radius:8px}
.rl li:first-child a{border-top:0}
.rl li a:hover{background:var(--surface-2)}
.rn{width:24px;flex:none;text-align:center;font-size:12.5px;color:var(--text-3);font-weight:600}
.rl .bdg{margin:0}
.rn:has(.bdg){width:auto;min-width:24px}
.rm{flex:1;min-width:0;display:flex;flex-direction:column}
.rm b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rm small{font-size:12px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rv{font-weight:700;white-space:nowrap}
/* highlight cards */
.hcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-bottom:16px}
.hc{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line-2);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow);display:flex;flex-direction:column;min-width:0;cursor:pointer}
.hc:hover{border-color:var(--line-2)}
.hc.g{border-left-color:#22c55e}.hc.p{border-left-color:#8b5cf6}.hc.b{border-left-color:#0ea5e9}.hc.o{border-left-color:#f59e0b}.hc.r{border-left-color:#ef4444}
.hc span{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--text-3)}
.hc b{font-size:16px;font-weight:700;margin:4px 0 2px;line-height:1.25}
.hc small{font-size:12.5px;color:var(--text-2)}
/* badges, bars */
.bdg{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.03em;padding:2px 8px;border-radius:999px;white-space:nowrap}
.bdg.good{background:rgba(34,197,94,.14);color:#15803d}.bdg.bad{background:rgba(239,68,68,.13);color:#dc2626}.bdg.meh{background:rgba(245,158,11,.16);color:#b45309}.bdg.plain{background:var(--surface-2);color:var(--text-2);border:1px solid var(--line)}
:root[data-theme="dark"] .bdg.good{color:#4ade80}:root[data-theme="dark"] .bdg.bad{color:#f87171}:root[data-theme="dark"] .bdg.meh{color:#fbbf24}
.pcell{display:flex;align-items:center;justify-content:flex-end;gap:8px}
.pb{flex:1;max-width:90px;height:7px;display:flex;justify-content:flex-end}
.pb i{display:block;height:100%;border-radius:4px}.pb i.pos{background:#22c55e}.pb i.neg{background:#ef4444}
.td small a{color:inherit}.td b a{color:inherit}.td b a:hover,.td small a:hover{text-decoration:underline}
.log .td{white-space:nowrap}
.chart2{position:relative;margin:4px -4px 0}
.chart2 .gl{stroke:var(--line);stroke-width:1}.chart2 .ax{stroke:var(--line-2);stroke-width:1}
.chart2 .tk{fill:var(--text-3);font:11px var(--font)}.chart2 .tk.td{fill:var(--accent);font-weight:700}
.chart2 .br.up{fill:#22c55e}.chart2 .br.dn{fill:#ef4444}.chart2 .br.dim{opacity:.25}
.chart2 .hit{fill:transparent;cursor:pointer}.chart2 .hit:hover{fill:var(--text);fill-opacity:.05}
.log2{margin:0;padding-left:18px;color:var(--text-2)}.log2 li{margin:4px 0}
/* ---- page head + period picker ---- */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px 24px;flex-wrap:wrap;margin-bottom:18px}
.ph-l{min-width:0}
.ph h1{margin:0;font-size:26px;line-height:1.15;font-weight:700;letter-spacing:-.02em}
.ph-sub{margin:4px 0 0;color:var(--text-2);font-size:14px;max-width:680px}
.back{display:inline-block;margin-bottom:6px;font-size:13px;font-weight:500;color:var(--text-2)}.back:hover{color:var(--text)}
.ph-r{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pp{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;padding:3px;gap:2px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line)}
.seg button{padding:5px 12px;border-radius:7px;font-size:13px;font-weight:500;color:var(--text-2);white-space:nowrap}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--surface);color:var(--text);font-weight:600;box-shadow:var(--shadow);outline:1px solid var(--line)}
:root[data-theme="dark"] .seg button.on{background:var(--line-2);outline:0}
.step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--surface);height:36px}
.step button{width:34px;height:34px;font-size:18px;line-height:1;color:var(--text-2)}
.step button:hover:not([disabled]){color:var(--text)}.step button[disabled]{opacity:.3;cursor:default}
.step span{min-width:150px;text-align:center;font-weight:600;font-size:13.5px;white-space:nowrap}

/* ---- hero (headline numbers) ---- */
.hero{display:grid;grid-template-columns:minmax(260px,.85fr) 2fr;gap:20px 36px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px 28px;margin-bottom:16px;box-shadow:var(--shadow)}
.eyebrow{font-size:13px;color:var(--text-2);font-weight:500}
.big{font-size:40px;line-height:1.1;font-weight:700;letter-spacing:-.03em;margin:6px 0 4px}
.under{font-size:13.5px;color:var(--text-2)}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px 24px;margin:0}
.fact{min-width:0;border-left:1px solid var(--line);padding-left:18px}
.fact dt{font-size:12.5px;color:var(--text-3);font-weight:500}
.fact dd{margin:4px 0 2px;font-size:20px;font-weight:650;letter-spacing:-.01em}
.fact small{display:block;font-size:12.5px;color:var(--text-3);line-height:1.35}
.wl{margin-top:14px;display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--text-3)}
.wl b{font-weight:600}
.wl-bar{display:block;height:6px;border-radius:3px;background:var(--neg);overflow:hidden;max-width:300px;margin-bottom:6px;opacity:.9}
.wl-bar i{display:block;height:100%;background:var(--pos)}
.extremes{margin-top:12px;display:flex;flex-wrap:wrap;gap:4px 18px;font-size:12.5px;color:var(--text-3)}

/* ---- cards, lists ---- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:16px;box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;min-height:30px}
.card-h h2{margin:0;font-size:15px;font-weight:650;letter-spacing:-.01em}
.card-h a{font-size:13px;font-weight:600;color:var(--accent)}
.hint{font-size:12.5px;color:var(--text-3)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 16px}
.list{margin:0 -6px}
.li{display:flex;align-items:center;gap:14px;padding:9px 6px;border-radius:9px;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li:hover{background:var(--surface-2)}
.li-m{flex:1;min-width:0;display:flex;flex-direction:column}
.li-m b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li-m small,.li-v small{font-size:12.5px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li-v{text-align:right;display:flex;flex-direction:column;align-items:flex-end}
.li-v b{font-weight:650;white-space:nowrap}
.more{display:block;margin:10px auto 2px;padding:7px 14px;border-radius:9px;border:1px solid var(--line-2);font-size:13px;font-weight:500;color:var(--text-2);text-align:center}
a.more{width:max-content}
.more:hover{color:var(--text)}
.empty{padding:26px 10px;text-align:center;color:var(--text-3)}
.empty p{margin:0 0 12px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:9px;background:var(--accent);color:#fff;font-size:13.5px;font-weight:600;white-space:nowrap}
.btn.ghost{background:var(--surface);color:var(--text);border:1px solid var(--line-2)}
.btn.ghost:hover{background:var(--surface-2)}
.link{color:var(--accent);font-weight:600;font-size:13px}
.foot{display:flex;justify-content:flex-end;margin-top:10px}
.focus{display:flex;align-items:center;flex-wrap:wrap;gap:8px 12px;margin:26px 0 12px}
.focus h2{margin:0;font-size:18px;font-weight:700;letter-spacing:-.01em}

/* ---- toolbar ---- */
.toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.search{flex:1 1 260px;max-width:440px;position:relative;display:flex;align-items:center}
.search svg{position:absolute;left:11px;width:16px;height:16px;fill:none;stroke:var(--text-3);stroke-width:2;stroke-linecap:round}
.search input{width:100%;height:36px;padding:0 12px 0 34px;border-radius:10px;border:1px solid var(--line);background:var(--surface);outline:none}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.select{height:36px;padding:0 30px 0 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:500}
.sumline{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 4px 10px;font-size:13.5px;color:var(--text-2)}

/* ---- tabs ---- */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:22px 0 14px;overflow-x:auto}
.tabs button{padding:10px 12px;font-weight:600;font-size:14px;color:var(--text-2);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button span{font-weight:500;color:var(--text-3);font-size:12.5px}
.tabs button.on{color:var(--text);border-color:var(--accent)}

/* ---- tables ---- */
.tbl{margin:0 -8px}
.tr{display:grid;grid-template-columns:var(--cols);gap:0 14px;align-items:center;padding:9px 8px;border-top:1px solid var(--line);min-height:46px}
.th-row{border-top:0;min-height:0;padding:2px 8px 8px;border-bottom:1px solid var(--line);font-size:12px;font-weight:500;color:var(--text-3)}
.th-row+.tr,.th-row+.tg{border-top:0}
.td{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.td.n{text-align:right}
.td b{font-weight:600}
.td small{display:block;font-size:12px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:400}
.td-meta{display:none}
.th{font:inherit;color:inherit;white-space:nowrap}.th:hover,.th.on{color:var(--text)}
a.tr:hover,.tr.click:hover{background:var(--surface-2);border-radius:8px}
.tr.click{cursor:pointer}
.tr.open,.tr.sel{background:var(--surface-2);border-radius:8px}
.tr.sel{box-shadow:inset 3px 0 0 var(--accent)}
.tg{display:flex;align-items:baseline;gap:10px;padding:16px 8px 7px;border-bottom:1px solid var(--line)}
.tg:first-child{padding-top:4px}
.tg b{font-size:13px;font-weight:650}
.tg span{font-size:12.5px;color:var(--text-3)}
.tg .tg-r{margin-left:auto;font-size:13px;font-weight:600;color:var(--text-2)}
.tg+.tr{border-top:0}
.chev{display:inline-block;color:var(--text-3);font-size:17px;line-height:1;transition:transform .15s}
.chev.open{transform:rotate(90deg)}
.tdetail{margin:4px 0 12px;padding:6px 16px 14px;border-radius:12px;background:var(--bg);border:1px solid var(--line)}
.tdetail h3{margin:14px 0 6px;font-size:13.5px;font-weight:650}.tdetail h3 span{font-weight:400;color:var(--text-3);font-size:12.5px;margin-left:6px}
.tdetail .tbl{margin:0 -6px}
.mbar{display:inline-block;width:56px;height:4px;border-radius:2px;background:var(--line-2);overflow:hidden;flex:none}
.mbar i{display:block;height:100%;background:var(--pos);border-radius:2px}
.soldcell{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-2)}
.unsold{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:10px 0 2px;border-top:1px solid var(--line);margin-top:2px}
.unsold>span:first-child{font-size:12.5px;color:var(--text-3);margin-right:4px}
.tag{font-size:12.5px;color:var(--text-2);background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:2px 8px}
.tag b{color:var(--text);font-weight:600}
.sales .c-time{font-size:13px}

/* ---- chart ---- */
.chart{position:relative;margin:4px -4px 0}
.chart svg{display:block}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .axis{stroke:var(--line-2);stroke-width:1}
.chart .tick{fill:var(--text-3);font:11px var(--font)}
.chart .tick.today{fill:var(--accent);font-weight:700}
.chart .bar.up{fill:var(--pos)}.chart .bar.down{fill:var(--neg)}.chart .bar.dim{opacity:.22}
.chart .hit{fill:transparent;cursor:pointer}.chart .hit:hover{fill:var(--text);fill-opacity:.05}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line-2);border-radius:10px;padding:8px 10px;font-size:12.5px;box-shadow:0 8px 24px rgba(0,0,0,.18);min-width:140px;z-index:5}
.tip b{display:block;font-weight:600}.tip span{display:block;font-weight:700;font-size:14px}.tip small{display:block;color:var(--text-3)}

/* ---- import ---- */
.drop{display:flex;align-items:center;justify-content:center;min-height:120px;border:1.5px dashed var(--line-2);border-radius:12px;color:var(--text-2);cursor:pointer;text-align:center;padding:16px}
.drop.over,.drop:hover{border-color:var(--accent);color:var(--text)}
.drop input{display:none}
textarea{width:100%;min-height:120px;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:12px;resize:vertical;outline:none}
textarea:focus{border-color:var(--accent)}
.log{margin:0;padding-left:18px;color:var(--text-2)}.log li{margin:4px 0}

/* ---- sign-in / setup ---- */
.center{max-width:380px;margin:12vh auto;padding:28px;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.center h2{margin:0 0 6px;font-size:22px;letter-spacing:-.02em}
.center form{display:flex;flex-direction:column;gap:12px;margin-top:14px}
.center label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:500;color:var(--text-2)}
.center input{height:42px;padding:0 12px;border-radius:10px;border:1px solid var(--line-2);background:var(--bg);outline:none;font-size:16px;color:var(--text)}
.center input:focus{border-color:var(--accent)}
.center .primary{height:42px;border-radius:10px;background:var(--accent);color:#fff;font-weight:600}
.center .ghost{height:40px;border-radius:10px;border:1px solid var(--line-2);color:var(--text-2);font-weight:500}
.center .link{font-weight:500;color:var(--text-3);font-size:12.5px}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:color-mix(in srgb,var(--bg) 60%,transparent);z-index:60}
#loading div{background:var(--surface);border:1px solid var(--line);padding:12px 18px;border-radius:12px;font-weight:500}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--surface);border:1px solid var(--line-2);color:var(--text);padding:10px 16px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.2);transition:.2s;z-index:70;max-width:min(560px,90vw)}
.toast.show{opacity:1;transform:translate(-50%,0)}.toast.err{border-color:var(--neg)}

/* ---- medium screens ---- */
@media (max-width:1180px){
  .tr{grid-template-columns:var(--cols-md)}
  .td.md{display:none}
  .hero{grid-template-columns:1fr}
  .facts{grid-template-columns:repeat(4,minmax(0,1fr))}
  .fact:first-child{border-left:0;padding-left:0}
}
@media (max-width:1000px){
  .grid2{grid-template-columns:minmax(0,1fr)}
}

/* ---- phones and small tablets ---- */
@media (max-width:900px){.tb-r .upd{display:none}.gwrap{width:190px}}
@media (max-width:820px){
  .hdr-in{padding:8px 12px;gap:8px}
  .brand span{display:none}
  .psel{max-width:150px;font-size:16px;height:36px}
  .csvbtn span{display:none}.csvbtn{padding:0 10px}
  .tabbar-in{padding:0 8px;flex-direction:column;align-items:stretch;gap:0}
  .tb-r{padding:0 4px 8px}.gwrap{width:100%}.gresults{width:100%;left:0}
  input,select,textarea,.gsearch,.search input{font-size:16px!important}
  main{padding:16px 12px 60px}
  .ptitle{font-size:21px}
  .ptitle-row{justify-content:space-between}
  .kcards{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .kc.lead{grid-column:1/-1}.kc b{font-size:20px}
  .hcards{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .g2{grid-template-columns:minmax(0,1fr)}
  .card{padding:14px;border-radius:12px}
  .card-h{flex-wrap:wrap}
  .cctl{justify-content:flex-start;width:100%}.cctl .search{flex:1 1 100%}
  .hero{padding:18px;border-radius:14px;gap:16px}
  .big{font-size:32px}
  .facts{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px}
  .fact{border-left:0;padding-left:0}
  .tbl{margin:0 -4px}
  .th-row{display:none}
  .tr{grid-template-columns:minmax(0,1fr) auto!important;gap:2px 12px;padding:10px 4px;min-height:0}
  .td{display:none}
  .td.p{display:block;grid-column:1;grid-row:1}
  .td.v{display:block;grid-column:2;grid-row:1/span 2;align-self:center;text-align:right}
  .td.p small{display:none}
  .td.p{min-width:0;overflow:hidden}.td.p b{display:block;white-space:normal;line-height:1.3}
  .td-meta{display:block;grid-column:1;grid-row:2;font-size:12.5px;color:var(--text-3);white-space:normal;line-height:1.35;min-width:0}
  .td-meta .bdg{font-size:9.5px;padding:1px 6px;vertical-align:1px}
  .td.v .pcell .pb{display:none}
  .tg{padding:14px 4px 6px;flex-wrap:wrap;row-gap:0}
  .ph{flex-direction:column;align-items:stretch;gap:12px;margin-bottom:14px}.ph h1{font-size:23px}
}
@media (hover:none){
  a.tr:hover,.tr.click:hover,.li:hover{background:none}
  .tr.open,.tr.sel{background:var(--surface-2)}
}
.td .wrap{white-space:normal}
</style>
</head>
<body>
<section id="setup" class="center" hidden>
  <h2>PL Orders</h2>
  <p class="hint">Connect your Supabase project once. Both values are in Supabase under Project Settings, API.</p>
  <form id="setupForm">
    <label>Project URL <input id="sbUrl" type="text" required placeholder="https://xxxx.supabase.co"></label>
    <label>Anon public key <input id="sbKey" type="text" required placeholder="eyJhbGciOi…"></label>
    <button class="primary">Connect</button>
    <button type="button" class="ghost" id="demoBtn">Try a demo without saving</button>
  </form>
</section>

<section id="login" class="center" hidden>
  <h2>PL Orders</h2>
  <form id="loginForm">
    <label>Email <input id="email" type="email" required autocomplete="username"></label>
    <label>Password <input id="password" type="password" required autocomplete="current-password"></label>
    <button class="primary" id="loginBtn">Sign in</button>
    <button type="button" class="ghost" id="demoBtn2">Try a demo without saving</button>
    <button type="button" class="link" id="resetConn">Change Supabase connection</button>
  </form>
</section>

<div id="app" class="shell" hidden>
  <header class="hdr">
    <div class="hdr-in">
      <a class="brand" href="#overview"><span class="logo" aria-hidden="true"><svg width="30" height="30" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"> <defs><linearGradient id="brandg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2f6bff"/><stop offset=".55" stop-color="#7b3fe4"/><stop offset="1" stop-color="#12c48b"/></linearGradient></defs> <rect width="64" height="64" rx="15" fill="url(#brandg)"/> <g transform="rotate(-14 32 32)"> <path d="M10 21 a3 3 0 0 1 3-3 h38 a3 3 0 0 1 3 3 v6 a5 5 0 0 0 0 10 v6 a3 3 0 0 1-3 3 H13 a3 3 0 0 1-3-3 v-6 a5 5 0 0 0 0-10z" fill="#fff"/> <text x="28" y="41" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="24" fill="#4b2fc4">$</text> </g> </svg></span><span>PL Orders</span></a>
      <div class="hdr-r">
        <select id="periodSel" class="psel" aria-label="Period"></select>
        <button id="refreshBtn" class="hbtn" type="button" aria-label="Refresh data" title="Refresh data (also updates by itself every minute)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v5h-5"/></svg></button>
        <label class="csvbtn" title="Upload the PL orders CSV"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V7M7 12l5-5 5 5"/></svg><span>Orders CSV</span><input type="file" id="hdrCsv" accept=".csv,text/csv"></label>
        <div class="menu"><button id="menuBtn" class="hbtn" type="button" aria-label="More">⋯</button>
          <div id="menuPop" class="menu-pop" hidden>
            <a href="#import">Paste Discord sales</a>
            <button id="themeBtn" type="button"></button>
            <div id="status" class="mstat"></div>
            <button id="signOut" type="button">Sign out</button>
          </div></div>
      </div>
    </div>
    <div class="strip"></div>
  </header>
  <nav class="tabbar" aria-label="Main"><div class="tabbar-in">
    <div class="tabs2">
      <button data-tab="overview">Overview</button><button data-tab="insights">Insights</button><button data-tab="artists">Artists</button><button data-tab="venues">Venues</button><button data-tab="inventory">Inventory</button><button data-tab="sales">Sales Log</button>
    </div>
    <div class="tb-r">
      <div class="gwrap"><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></span>
        <input id="gsearch" class="gsearch" type="search" placeholder="Search artist, venue, order #" autocomplete="off" aria-label="Search">
        <div id="gresults" class="gresults" hidden></div></div>
      <span class="upd"><i></i><span id="updated">Updated</span></span>
    </div>
  </div></nav>
  <main id="view"></main>
</div>
<div id="loading" hidden><div>Loading your data…</div></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="config.js"></script>
<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
